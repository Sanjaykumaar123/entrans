<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inferential Statistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-main: #020617;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-strong: #22d3ee;
      --radius-xl: 22px;
    }

    body {
      margin: 0;
      background: #020617;
      color: var(--text-main);
      font-family: "Poppins", sans-serif;
      padding: 25px;
    }

    /* Shell */
    .shell {
      width: 92%;
      max-width: 1350px;
      margin: auto;
      background: rgba(15, 23, 42, 0.9);
      padding: 26px;
      border-radius: 28px;
      border: 1px solid rgba(148,163,184,0.4);
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .brand-icon {
      background: radial-gradient(circle at 30% 20%, #38bdf8, #0369a1);
      width: 36px;
      height: 36px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-title {
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* NAV */
    .nav-tabs {
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
    }

    .nav-tab {
      padding: 7px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      color: var(--text-muted);
    }

    .nav-tab:hover {
      color: var(--accent-strong);
    }

    .nav-tab.active {
      background: radial-gradient(circle at 0 0, rgba(56,189,248,0.6), rgba(59,130,246,0.7));
      color: #0b1120;
      font-weight: 600;
    }

    /* Panel */
    .panel {
      margin-top: 22px;
      padding: 24px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(51,65,85,0.7);
      border-radius: var(--radius-xl);
    }

    .panel-title {
      font-size: 26px;
      margin-bottom: 12px;
    }

    pre {
      background: rgba(15,23,42,0.95);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(51,65,85,0.7);
      font-size: 15px;
      color: var(--accent-strong);
      white-space: pre-wrap;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

  <div class="shell">

    <!-- Top Bar -->
    <div class="top-bar">

      <div class="brand">
        <div class="brand-icon">📈</div>
        <div class="brand-title">Inferential Stats</div>
      </div>

      <nav class="nav-tabs">
        <a href="descriptive.html" class="nav-tab">Descriptive</a>
        <a href="inferential.html" class="nav-tab active">Inferential</a>
        <a href="predict.html" class="nav-tab">Predict</a>
      </nav>

    </div>

    <!-- Content Panel -->
    <div class="panel">
      <h2 class="panel-title">Inferential Statistical Analysis</h2>
      <pre id="output">Loading...</pre>
    </div>

  </div>

  <script>
    fetch("http://127.0.0.1:8000/inferential")
      .then(res => res.json())
      .then(data => {
        document.getElementById("output").textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("output").textContent = "Error: " + err;
      });
  </script>

</body>
</html>
